<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06111d">
  <meta name="description" content="水分子、環状水六量体、メタン、ベンゼンなどを360度観察できる分子構造ビューワー">
  <title>分子構造ラボ</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="viewer" aria-label="3D分子表示領域"></div>

  <section id="panel" class="glass" aria-label="表示設定">
    <div class="brand">
      <div class="logo" aria-hidden="true">H₂O</div>
      <div>
        <h1>分子構造ラボ</h1>
        <p class="subtitle">Molecular Structure Lab</p>
      </div>
    </div>

    <label class="label" for="moleculeSelect">分子モデル</label>
    <select id="moleculeSelect"></select>

    <span class="label">表示方式</span>
    <div class="segmented" role="group" aria-label="表示方式">
      <button type="button" data-style="ballstick" class="active">球棒</button>
      <button type="button" data-style="spacefill">空間充填</button>
      <button type="button" data-style="wire">線</button>
    </div>

    <div class="toggle-grid">
      <button type="button" id="labelsBtn">原子名</button>
      <button type="button" id="anglesBtn">結合角</button>
      <button type="button" id="hydrogenBtn">水素結合</button>
      <button type="button" id="lonePairsBtn">電子対</button>
    </div>

    <div class="row">
      <button type="button" id="autoBtn" class="compact active">自動回転 ON</button>
      <button type="button" id="resetBtn" class="compact">リセット</button>
      <button type="button" id="fullBtn" class="compact">全画面</button>
      <button type="button" id="saveBtn" class="compact">PNG保存</button>
    </div>
  </section>

  <aside id="info" class="glass" aria-live="polite">
    <h2 id="moleculeName">水分子 H₂O</h2>
    <div id="formula" class="formula">H₂O</div>
    <p id="summary"></p>
    <p id="note" hidden></p>
  </aside>

  <div id="help">ドラッグ：回転　ホイール／ピンチ：拡大　右ドラッグ／2本指：移動</div>

  <section id="requestDock" class="glass" aria-label="分子リクエスト">
    <form id="requestForm" class="request-row">
      <input id="requestInput" autocomplete="off" placeholder="例：水分子を電子対と結合角つきで表示して" aria-label="表示したい分子を日本語で入力">
      <button id="requestBtn" type="submit">生成</button>
    </form>
    <div id="requestMessage" aria-live="polite">登録済みの分子と表示方法を日本語で指定できます。</div>
    <div class="examples" aria-label="入力例">
      <button type="button" data-example="水分子を電子対と結合角つきで表示して">水分子＋電子対</button>
      <button type="button" data-example="水の六員環を水素結合つきで表示して">水の六員環</button>
      <button type="button" data-example="メタンを空間充填モデルで表示して">メタン</button>
      <button type="button" data-example="ベンゼンを原子名つきで表示して">ベンゼン</button>
    </div>
  </section>

  <div id="loading">分子モデルを準備中…</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>
